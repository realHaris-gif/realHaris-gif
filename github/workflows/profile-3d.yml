name: Isometric skyline

on:
  schedule:
    - cron: "0 18 * * *"   # daily
  workflow_dispatch:        # manual run button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate skyline
        run: node scripts/isometric.mjs
        env:
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          # SHOW_STATS: "false"   # uncomment for skyline only (no panels)
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add isometric
          git commit -m "update skyline" || echo "nothing to commit"
          git push
